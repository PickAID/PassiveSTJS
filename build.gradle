buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
    }
    dependencies {
        classpath "org.tomlj:tomlj:1.1.1"
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'net.neoforged.gradle' version '6.0.21'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

apply plugin: 'org.spongepowered.mixin'

apply from: 'gradle/template-config.gradle'

def template = project.ext.template
def props = config
def templateDependencies = project.ext.templateDependencies
def hasModrinthTarget = !template.modrinthProject.isBlank()
def hasCurseforgeTarget = template.curseforgeProject > 0L
def modrinthUploadTaskName = "uploadModrinth"
def curseforgeUploadTaskName = "uploadCurseForge"

group = "com.pickaid"
version = props["mod_version"]
base {
    archivesName = "${props["archive_name"]}-${props["mc_version"]}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "mixins.${props["mod_id"]}.refmap.json"
    config "mixins.${props["mod_id"]}.json"
}

def mainBootstrapClasspath = {
    def output = sourceSets.main.output
    def paths = new LinkedHashSet<String>()
    if (output.resourcesDir != null) {
        paths.add(output.resourcesDir.absolutePath)
    }
    return paths.join(File.pathSeparator)
}

def configureCommonRun = { runConfig, String workingDirectory ->
    runConfig.workingDirectory project.file(workingDirectory)
    runConfig.property 'forge.logging.console.level', 'debug'
    runConfig.property 'forge.enabledGameTestNamespaces', props["mod_id"]
    runConfig.property 'mixin.env.remapRefMap', 'true'
    runConfig.property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
    runConfig.lazyToken 'minecraft_classpath', mainBootstrapClasspath
    runConfig.mods {
        "${props["mod_id"]}" {
            source sourceSets.main
        }
    }
}

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    copyIdeResources = true
    runs {
        client {
            configureCommonRun(delegate, 'run/client')
        }

        server {
            configureCommonRun(delegate, 'run/server')
        }
    }
}

repositories {
    maven { url = "https://maven.minecraftforge.net" }
    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/maven"
    }
    maven {
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    mavenCentral()
}

def resolvePassiveSkillTreeJar(String mcVersion) {
    def passiveSkillTreeJarName = "PassiveSkillTree-1.20.1-BETA-0.7.4-all.jar"
    def explicitJar = providers.gradleProperty("passiveSkillTreeJar").orNull ?: System.getenv("PASSIVE_SKILL_TREE_JAR")
    if (explicitJar) {
        def resolved = file(explicitJar)
        if (resolved.isFile()) {
            return resolved
        }
        throw new GradleException("Configured PassiveSkillTree jar does not exist: ${resolved}")
    }

    def candidates = [
            file(passiveSkillTreeJarName),
            file("libs/${passiveSkillTreeJarName}"),
            file("libraries/${mcVersion}/all/${passiveSkillTreeJarName}"),
            file("../${passiveSkillTreeJarName}"),
            file("../libs/${passiveSkillTreeJarName}"),
            file("../libraries/${mcVersion}/all/${passiveSkillTreeJarName}"),
            file("../PassiveSkillTree/build/libs/${passiveSkillTreeJarName}")
    ]

    def resolved = candidates.find { it.isFile() }
    if (resolved != null) {
        return resolved
    }

    return null
}

def passiveSkillTreeJar = resolvePassiveSkillTreeJar(props["mc_version"].toString())
def passiveSkillTreeCurseFileId = "7897205"
def passiveSkillTreeJarVersion = passiveSkillTreeJar != null ? passiveSkillTreeJar.name.substring("PassiveSkillTree-".length(), passiveSkillTreeJar.name.length() - ".jar".length()) : null
def passiveSkillTreeDependency = passiveSkillTreeJar != null
        ? "local.passiveskilltree:PassiveSkillTree:${passiveSkillTreeJarVersion}"
        : "curse.maven:passive-skill-tree-850298:${passiveSkillTreeCurseFileId}"

if (passiveSkillTreeJar != null) {
    println("PassiveSkillTree jar: ${passiveSkillTreeJar.absolutePath}")
} else {
    println("PassiveSkillTree dependency: curse.maven:passive-skill-tree-850298:${passiveSkillTreeCurseFileId} (fallback, local ${"PassiveSkillTree-1.20.1-BETA-0.7.4-all.jar"} not found)")
}

if (passiveSkillTreeJar != null) {
    repositories {
        flatDir {
            dirs passiveSkillTreeJar.parentFile
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${props["mc_version"]}-${props["forge_version"]}"
    implementation fg.deobf(passiveSkillTreeDependency)
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

    def addConfiguredDependency = { Map<String, Object> dependencySpec ->
        def dependency = project.dependencies.create(dependencySpec.notation as String) {
            transitive = dependencySpec.transitive
        }
        def resolvedDependency = dependencySpec.deobf ? fg.deobf(dependency) : dependency
        add(dependencySpec.configuration as String, resolvedDependency)
    }

    templateDependencies.each(addConfiguredDependency)
}

jar {
    manifest {
        attributes([
                "Implementation-Title"   : project.name,
                "Implementation-Version" : archiveVersion,
                "Implementation-Vendor"  : props["mod_authors"],
                "MixinConfigs"           : "mixins.${props["mod_id"]}.json"
        ])
    }
}

test {
    useJUnitPlatform()
    dependsOn jar
}

def changelogHeadingVersion = { String headingText ->
    headingText.trim().replaceFirst(/^\[([^\]]+)](?:\s*-\s*.*)?$/, '$1').replaceFirst(/^v(?=\d)/, "").trim()
}

def extractVersionChangelog = { String text, String version, String sourceLabel ->
    def lines = text.replace("\r\n", "\n").replace("\r", "\n").split("\n", -1).toList()
    def headingPattern = /^(#{1,6})\s+(.+?)\s*$/
    def start = -1
    def level = 0
    def wanted = version.replaceFirst(/^v(?=\d)/, "")
    lines.eachWithIndex { String line, int index ->
        if (start >= 0) return
        def matcher = line =~ headingPattern
        if (matcher.matches() && changelogHeadingVersion(matcher[0][2]) == wanted) {
            start = index + 1
            level = matcher[0][1].length()
        }
    }
    if (start < 0) {
        throw new GradleException("Could not find changelog section for version ${version} in ${sourceLabel}")
    }
    def end = lines.size()
    for (int index = start; index < lines.size(); index++) {
        def matcher = lines[index] =~ headingPattern
        if (matcher.matches() && matcher[0][1].length() <= level) {
            end = index
            break
        }
    }
    def extracted = lines.subList(start, end).join("\n").trim()
    if (extracted.isBlank()) {
        throw new GradleException("Changelog section for version ${version} in ${sourceLabel} is empty")
    }
    extracted
}

def configuredText = { String inlineText, String relativeFile, String sectionMode, String fallbackText = "" ->
    if (inlineText != null && !inlineText.isBlank()) return inlineText
    if (relativeFile != null && !relativeFile.isBlank()) {
        def source = file(relativeFile)
        if (!source.isFile()) {
            throw new GradleException("Configured publish text file does not exist: ${relativeFile}")
        }
        def text = source.getText("UTF-8")
        return sectionMode == "full" ? text : extractVersionChangelog(text, template.finalVersion, relativeFile)
    }
    fallbackText
}

def modrinthChangelogText = configuredText(template.publishModrinth.changelog, template.publishModrinth.changelogFile, template.publishModrinth.changelogSection, "No changelog was specified.")
def curseforgeChangelogText = configuredText(template.publishCurseforge.changelog, template.publishCurseforge.changelogFile, template.publishCurseforge.changelogSection, "")
def runtimeUploadJar = tasks.jar.archiveFile

def writeMultipartText = { OutputStream output, String boundary, String name, String value ->
    output.write("--${boundary}\r\n".getBytes("UTF-8"))
    output.write("Content-Disposition: form-data; name=\"${name}\"\r\n\r\n".getBytes("UTF-8"))
    output.write(value.getBytes("UTF-8"))
    output.write("\r\n".getBytes("UTF-8"))
}

def writeMultipartFile = { OutputStream output, String boundary, String name, File file ->
    output.write("--${boundary}\r\n".getBytes("UTF-8"))
    output.write("Content-Disposition: form-data; name=\"${name}\"; filename=\"${file.name}\"\r\n".getBytes("UTF-8"))
    output.write("Content-Type: application/java-archive\r\n\r\n".getBytes("UTF-8"))
    file.withInputStream { input -> input.transferTo(output) }
    output.write("\r\n".getBytes("UTF-8"))
}

tasks.register(modrinthUploadTaskName) {
    group = "upload"
    description = "Uploads the built runtime jar to Modrinth using project.toml settings."
    dependsOn("validateUploadConfiguration")
    dependsOn("jar")
    onlyIf { hasModrinthTarget }
    doLast {
        def token = System.env.MODRINTH_TOKEN ?: template.modrinthToken ?: ""
        def metadata = [project_id: template.modrinthProject, version_number: template.finalVersion, version_title: template.publishModrinth.versionName, version_type: template.releaseType, changelog: modrinthChangelogText, game_versions: template.publishModrinth.gameVersions, loaders: template.publishModrinth.loaders, featured: false, dependencies: [], file_parts: ["file"]]
        def boundary = "----PickAID${System.currentTimeMillis()}"
        def connection = (HttpURLConnection) new URL("https://api.modrinth.com/v2/version").openConnection()
        connection.setRequestMethod("POST")
        connection.setDoOutput(true)
        connection.setRequestProperty("Authorization", token)
        connection.setRequestProperty("User-Agent", "PickAIDTemplate/1.0")
        connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=${boundary}")
        connection.outputStream.withCloseable { output ->
            writeMultipartText(output, boundary, "data", groovy.json.JsonOutput.toJson(metadata))
            writeMultipartFile(output, boundary, "file", runtimeUploadJar.get().asFile)
            output.write("--${boundary}--\r\n".getBytes("UTF-8"))
        }
        def responseCode = connection.responseCode
        def responseText = responseCode >= 400 ? connection.errorStream?.getText("UTF-8") : connection.inputStream?.getText("UTF-8")
        if (responseCode < 200 || responseCode >= 300) {
            throw new GradleException("Modrinth upload failed with HTTP ${responseCode}: ${responseText ?: ''}")
        }
        logger.lifecycle("Modrinth upload accepted: ${responseText ?: "HTTP ${responseCode}"}")
    }
}

tasks.register(curseforgeUploadTaskName) {
    group = "upload"
    description = "Uploads the built runtime jar to CurseForge using project.toml settings."
    dependsOn("validateUploadConfiguration")
    dependsOn("jar")
    onlyIf { hasCurseforgeTarget }
    doLast {
        def token = System.env.CURSEFORGE_TOKEN ?: template.curseforgeToken ?: ""
        def metadata = [changelog: curseforgeChangelogText, changelogType: template.publishCurseforge.changelogType, displayName: template.publishCurseforge.displayName, gameVersions: template.publishCurseforge.gameVersions, releaseType: template.releaseType]
        if (template.publishCurseforge.manualRelease) metadata.isManualRelease = true
        if (template.publishCurseforge.parentFileId > 0L) metadata.parentFileID = template.publishCurseforge.parentFileId
        def boundary = "----PickAID${System.currentTimeMillis()}"
        def connection = (HttpURLConnection) new URL("https://minecraft.curseforge.com/api/projects/${template.curseforgeProject}/upload-file").openConnection()
        connection.setRequestMethod("POST")
        connection.setDoOutput(true)
        connection.setRequestProperty("X-Api-Token", token)
        connection.setRequestProperty("Content-Type", "multipart/form-data; boundary=${boundary}")
        connection.outputStream.withCloseable { output ->
            writeMultipartText(output, boundary, "metadata", groovy.json.JsonOutput.toJson(metadata))
            writeMultipartFile(output, boundary, "file", runtimeUploadJar.get().asFile)
            output.write("--${boundary}--\r\n".getBytes("UTF-8"))
        }
        def responseCode = connection.responseCode
        def responseText = responseCode >= 400 ? connection.errorStream?.getText("UTF-8") : connection.inputStream?.getText("UTF-8")
        if (responseCode < 200 || responseCode >= 300) {
            throw new GradleException("CurseForge upload failed with HTTP ${responseCode}: ${responseText ?: ''}")
        }
        logger.lifecycle("CurseForge upload accepted: ${responseText ?: "HTTP ${responseCode}"}")
    }
}

def validateUploadConfiguration = tasks.register('validateUploadConfiguration') {
    group = "upload"
    doLast {
        modrinthChangelogText
        curseforgeChangelogText
        if (!hasModrinthTarget && !hasCurseforgeTarget) {
            throw new GradleException("At least one upload platform must be configured")
        }
        if (!(template.releaseType in ["alpha", "beta", "release"])) {
            throw new GradleException("release_type must be one of alpha, beta, release")
        }
    }
}

tasks.register('buildAndUploadMod') {
    group = "upload"
    dependsOn validateUploadConfiguration
    if (hasModrinthTarget) dependsOn modrinthUploadTaskName
    if (hasCurseforgeTarget) dependsOn curseforgeUploadTaskName
}
